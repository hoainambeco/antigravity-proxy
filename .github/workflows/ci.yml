name: Antigravity Engine Pipeline

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  engine-validation:
    name: Core Engine Validation & Container Delivery
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: 🔍 Type Checking (Strict TypeScript)
        run: npm run type-check

      - name: ⚙️ Compile NestJS Application
        run: npm run build

      - name: 🗄️ Validate SQLite Database Migrations
        run: npm run migration:run

      - name: 🐳 Set up Docker Buildx Engine
        uses: docker/setup-buildx-action@v3

      - name: 📦 Build Production Container Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: llm-gateway-proxy:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
